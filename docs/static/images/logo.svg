<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="rommate">
  <title>rommate</title>
  <defs>
    <linearGradient id="rommate-gradient" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7B61FF"/>
      <stop offset="1" stop-color="#FF7AB8"/>
    </linearGradient>
    <!-- D-pad with the download arrow cut out, so the mark works on any background. -->
